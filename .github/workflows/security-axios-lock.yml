name: Security Axios lockfile validation

on:
  push:
    branches:
      - agent/security-axios-lock
    paths:
      - package.json

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-axios-lock
          fetch-depth: 0

      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: Use npm 8 for overrides with v1 lockfile
        run: npm install --global npm@8.19.4

      - name: Regenerate v1 lockfile
        run: npm install --package-lock-only --ignore-scripts --lockfile-version=1

      - name: Install from regenerated lockfile
        run: npm ci

      - name: Build starter kit
        run: npm run build

      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate lockfile for Axios security update"
            git push origin HEAD:agent/security-axios-lock
          fi
