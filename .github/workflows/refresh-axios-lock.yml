name: Refresh Axios lockfile

on:
  push:
    branches:
      - chore/axios-security-fix-2026-09-13

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-refresh]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/axios-security-fix-2026-09-13
      - uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: npm
          cache-dependency-path: archive/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh npm6 lockfile [lockfile-refresh]"
          git push
